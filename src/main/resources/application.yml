application:
  title: "sicad-backend"
  version: "1.0.0"
server:
  port: ${SERVER_PORT}

spring:
  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: ${APP_ENV}

jwt:
  secret: ${KEY_SECRET}